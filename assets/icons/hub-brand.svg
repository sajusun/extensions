  <path d="M178 328 L198 336 V352 C198 366 188 376 178 382 C168 376 158 366 158 352 V336 L178 328 Z" fill="#10b981"/>
  <path d="M172 355 L176 359 L185 349" stroke="#ffffff" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" fill="none"/>

