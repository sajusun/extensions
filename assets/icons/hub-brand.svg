  <rect x="8" y="8" width="496" height="496" rx="104" fill="none" stroke="#1e293b" stroke-width="4"/>

  <!-- Browser Frame Window -->
  <rect x="76" y="86" width="360" height="340" rx="28" fill="#111827" stroke="#334155" stroke-width="4"/>
  
